<div class="login-page">
  <div class="login-grid">
    <section class="login-card">
      <h1>Welcome Back, {{ roleLabel() }}</h1>
      <p class="login-sub">Please enter your credentials to access your portal.</p>

      <div class="role-tabs">
        <a
          *ngFor="let tab of tabs"
          class="role-tab"
          [class.active]="role() === tab.key"
          [routerLink]="['/login', tab.key]"
        >
          {{ tab.label }}
        </a>
      </div>

      <form class="login-form" [formGroup]="loginForm"
  (ngSubmit)="onSubmit()">
        <label class="field-label" for="email">Email Address</label>
        <div class="input-wrap">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input id="email" type="email" formControlName="email" [placeholder]="emailPlaceholder()" autocomplete="username" />
        </div>

        <div class="password-row">
          <label class="field-label" for="password">Password</label>
          <a href="#" class="forgot-link">Forgot Password?</a>
        </div>
        <div class="input-wrap">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <rect x="5" y="11" width="14" height="9" rx="1.6" stroke="currentColor" stroke-width="1.8"/>
            <path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8"/>
          </svg>
          <input
            id="password"
            formControlName="password"
            [type]="showPassword() ? 'text' : 'password'"
            autocomplete="current-password"
          />
          <button type="button" class="eye-btn" (click)="togglePasswordVisibility()" aria-label="Toggle password visibility">
             @if(!showPassword()){
              <i class="bi bi-eye"></i>
              }@else {
              <i class="bi bi-eye-slash"></i>
              }
          </button>
        </div>

        <label class="remember-row">
          <span class="checkbox" [class.checked]="rememberMe()" (click)="toggleRememberMe()">
            <svg *ngIf="rememberMe()" width="12" height="12" viewBox="0 0 24 24" fill="none">
              <path d="M4 12l6 6 10-12" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          Remember me for 30 days
        </label>

         @if(errorMessage){

<div class="alert-error">
    {{ errorMessage }}
</div>
}
        <button type="submit" class="btn btn-primary btn-login"  [disabled]="loginForm.invalid">Login</button>
            @if (role() !== 'admin') {
            <button
                type="button"
                class="btn btn-outline btn-create"
                [routerLink]="registerRoute()">
                Create Account
            </button>
            }      
        </form>
    </section>

    <section class="login-illustration" aria-hidden="true">
      <div class="illustration-frame">
          <img src="/login.png" alt="Login">
      </div>
    </section>
  </div>
</div>
