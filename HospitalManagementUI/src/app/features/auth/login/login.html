<div class="login-page">
  <div class="login-grid">
    <section class="login-card">
      <h1>Welcome Back, {{ roleLabel() }}</h1>
      <p class="login-sub">Please enter your credentials to access your portal.</p>

      <div class="role-tabs">
        <a
          *ngFor="let tab of tabs"
          class="role-tab"
          [class.active]="role() === tab.key"
          [routerLink]="['/login', tab.key]"
        >
          {{ tab.label }}
        </a>
      </div>

      <form class="login-form" (submit)="$event.preventDefault()">
        <label class="field-label" for="email">Email Address</label>
        <div class="input-wrap">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input id="email" type="email" [placeholder]="emailPlaceholder()" autocomplete="username" />
        </div>

        <div class="password-row">
          <label class="field-label" for="password">Password</label>
          <a href="#" class="forgot-link">Forgot Password?</a>
        </div>
        <div class="input-wrap">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <rect x="5" y="11" width="14" height="9" rx="1.6" stroke="currentColor" stroke-width="1.8"/>
            <path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8"/>
          </svg>
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            value="password"
            autocomplete="current-password"
          />
          <button type="button" class="eye-btn" (click)="togglePasswordVisibility()" aria-label="Toggle password visibility">
            <svg *ngIf="!showPassword()" width="19" height="19" viewBox="0 0 24 24" fill="none">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
            </svg>
            <svg *ngIf="showPassword()" width="19" height="19" viewBox="0 0 24 24" fill="none">
              <path d="M3 3l18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M6.5 6.7C4 8.3 2 12 2 12s3.6 7 10 7c1.9 0 3.5-.5 4.9-1.3M9.9 5.2c.7-.1 1.4-.2 2.1-.2 6.4 0 10 7 10 7-.5 1-1.5 2.5-2.9 3.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <label class="remember-row">
          <span class="checkbox" [class.checked]="rememberMe()" (click)="toggleRememberMe()">
            <svg *ngIf="rememberMe()" width="12" height="12" viewBox="0 0 24 24" fill="none">
              <path d="M4 12l6 6 10-12" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          Remember me for 30 days
        </label>

        <button type="submit" class="btn btn-primary btn-login">Login</button>
            @if (role() !== 'admin') {
            <button
                type="button"
                class="btn btn-outline btn-create"
                [routerLink]="registerRoute()">
                Create Account
            </button>
            }      
        </form>
    </section>

    <section class="login-illustration" aria-hidden="true">
      <div class="illustration-frame">
          <img src="/login.png" alt="Login">
      </div>
    </section>
  </div>
</div>
