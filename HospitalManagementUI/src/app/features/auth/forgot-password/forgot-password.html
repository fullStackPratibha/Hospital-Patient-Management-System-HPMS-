<div class="screen">
  <header class="top-bar">
    <button class="back-btn" (click)="goBack()" aria-label="Go back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"></path>
        <path d="M12 19l-7-7 7-7"></path>
      </svg>
    </button>
    <h1 class="title">Reset Password</h1>
    <span class="spacer"></span>
  </header>

  <p class="subtitle">
    Please enter your email and set a new password to secure your account.
  </p>

  <form class="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="field">
      <label for="email">Email Address</label>
      <div class="input-wrap">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"></rect>
          <path d="M22 6l-10 7L2 6"></path>
        </svg>
        <input
          id="email"
          type="email"
          placeholder="e.g., alex&#64;example.com"
          [(ngModel)]="email"
          name="email"
          autocomplete="email"
        />
      </div>
    </div>

    <div class="field">
      <label for="newPassword">New Password</label>
      <div class="input-wrap">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <input
          id="newPassword"
          type="password"
          placeholder="At least 8 characters"
          [(ngModel)]="newPassword"
          name="newPassword"
          autocomplete="new-password"
        />
      </div>
    </div>

    <div class="field">
      <label for="confirmPassword">Confirm Password</label>
      <div class="input-wrap">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 1 2.64 6.36"></path>
          <path d="M3 12v5h5"></path>
        </svg>
        <input
          id="confirmPassword"
          type="password"
          placeholder="Repeat your new password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          autocomplete="new-password"
        />
      </div>
    </div>

    @if (errorMessage()) {
      <p class="error-text">{{ errorMessage() }}</p>
    }
    @if (successMessage()) {
      <p class="success-text">{{ successMessage() }}</p>
    }

    <button type="submit" class="submit-btn">Reset Password</button>
  </form>
</div>
