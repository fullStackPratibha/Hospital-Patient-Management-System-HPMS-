<div class="topbar">
      <div class="search-wrap" *ngIf="showSearch">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/>
          <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <input type="text" [placeholder]="searchPlaceholder" />
      </div>
      <div class="spacer"></div>
      <div class="topbar-actions">
        <button class="icon-btn" aria-label="Notifications">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
            <path d="M6 9a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 13 6 9z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M10 18.5a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <span class="dot"></span>
        </button>
        <button class="icon-btn" aria-label="Help">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/>
            <path d="M9.5 9.3a2.5 2.5 0 0 1 4.9.7c0 1.7-2.4 2-2.4 3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <circle cx="12" cy="16.7" r="0.9" fill="currentColor"/>
          </svg>
        </button>
        <span class="avatar">
          <img [src]="avatarUrl" alt="Profile" />
        </span>
      </div>
    </div>
