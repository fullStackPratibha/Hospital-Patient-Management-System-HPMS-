<aside class="sidebar">
  <div class="sidebar-top">
    <div class="brand">
      <span class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M12 2 4 5v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V5l-8-3z" fill="#123ea8"/>
          <path d="M12 8v8M8 12h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-text">carePlus<span class="brand-colon">:</span>HMS</span>
    </div>
    <p class="brand-sub">Medical Portal</p>

    <nav class="nav">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.path"
        routerLinkActive="active"
        class="nav-item"
      >
        <span class="nav-icon">
  <i *ngIf="item.icon === 'grid'" class="bi bi-grid"></i>
  <i *ngIf="item.icon === 'calendar'" class="bi bi-calendar3"></i>
  <i *ngIf="item.icon === 'file'" class="bi bi-file-earmark-medical"></i>
  <i *ngIf="item.icon === 'history'" class="bi bi-clock-history"></i>
  <i *ngIf="item.icon === 'user'" class="bi bi-person-circle"></i>
  <i *ngIf="item.icon === 'gear'" class="bi bi-gear"></i>

</span>
        {{ item.label }}
      </a>
    </nav>
  </div>

  <button type="button" class="logout-btn" (click)="logout()">
    <i class="bi bi-box-arrow-right"></i>
    Logout
  </button>
</aside>
