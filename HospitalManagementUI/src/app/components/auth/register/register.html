<div class="registration-page">

    <div class="registration-card">

        <!-- ================= LEFT SIDE ================= -->

        <div class="form-section">

            <div class="heading">

                <h1>
                    Patient <span>Registration</span>
                </h1>

                <p>
                    Create your account to book appointments and manage your healthcare.
                </p>

            </div>

            <form>

                <!-- First & Last Name -->

                <div class="row">

                    <div class="col-md-6 mb-6">

                        <label class="form-label">
                            First Name
                        </label>

                        <div class="input-box">

                            <i class="bi bi-person"></i>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="Enter first name">

                        </div>

                    </div>

                    <div class="col-md-6 mb-4">

                        <label class="form-label">
                            Last Name
                        </label>

                        <div class="input-box">

                            <i class="bi bi-person"></i>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="Enter last name">

                        </div>

                    </div>

                </div>

                <!-- Email -->

                <div class="mb-4">

                    <label class="form-label">

                        Email Address

                    </label>

                    <div class="input-box">

                        <i class="bi bi-envelope"></i>

                        <input
                            type="email"
                            class="form-control"
                            placeholder="Enter email address">

                    </div>

                </div>

                <!-- Phone & Age -->

                <div class="row">

                    <div class="col-md-6 mb-4">

                        <label class="form-label">

                            Phone Number

                        </label>

                        <div class="input-box">

                            <i class="bi bi-telephone"></i>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="Enter phone number">

                        </div>

                    </div>

                    <div class="col-md-6 mb-4">

                        <label class="form-label">

                            Age

                        </label>

                        <div class="input-box">

                            <i class="bi bi-calendar-event"></i>

                            <input
                                type="number"
                                class="form-control"
                                placeholder="Age">

                        </div>

                    </div>

                </div>

                <!-- Gender & Blood Group -->

                <div class="row">

                    <div class="col-md-6 mb-4">

                        <label class="form-label">

                            Gender

                        </label>

                        <div class="input-box">

                            <i class="bi bi-gender-ambiguous"></i>

                            <select class="form-select">

                                <option selected disabled>
                                    Select Gender
                                </option>

                                <option>Male</option>

                                <option>Female</option>

                                <option>Other</option>

                            </select>

                        </div>

                    </div>

                    <div class="col-md-6 mb-4">

                        <label class="form-label">

                            Blood Group

                        </label>

                        <div class="input-box">

                            <i class="bi bi-droplet"></i>

                            <select class="form-select">

                                <option selected disabled>
                                    Select Blood Group
                                </option>

                                <option>A+</option>
                                <option>A-</option>
                                <option>B+</option>
                                <option>B-</option>
                                <option>AB+</option>
                                <option>AB-</option>
                                <option>O+</option>
                                <option>O-</option>

                            </select>

                        </div>

                    </div>

                </div>

                <!-- Address -->

                <div class="mb-4">

                    <label class="form-label">

                        Address

                    </label>

                    <div class="input-box textarea-box">

                        <i class="bi bi-geo-alt"></i>

                        <textarea
                            rows="3"
                            class="form-control"
                            placeholder="Enter your address"></textarea>

                    </div>

                </div>

                <!-- Password -->

                <div class="row">

                    <div class="col-md-6 mb-4">

                        <label class="form-label">

                            Password

                        </label>

                        <div class="input-box">

                            <i class="bi bi-lock"></i>

                            <input
                                type="password"
                                class="form-control"
                                placeholder="Password">

                            <span class="eye">

                                <i class="bi bi-eye"></i>

                            </span>

                        </div>

                    </div>

                    <div class="col-md-6 mb-4">

                        <label class="form-label">

                            Confirm Password

                        </label>

                        <div class="input-box">

                            <i class="bi bi-lock"></i>

                            <input
                                type="password"
                                class="form-control"
                                placeholder="Confirm Password">

                            <span class="eye">

                                <i class="bi bi-eye"></i>

                            </span>

                        </div>

                    </div>

                </div>

                <!-- Terms -->

                <div class="form-check mb-4">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="terms">

                    <label
                        class="form-check-label"
                        for="terms">

                        I accept the
                        <a href="#">Terms of Use</a>
                        &
                        <a href="#">Privacy Policy</a>

                    </label>

                </div>
                

                <!-- Register Button -->

                <button
                    class="btn register-btn w-100">

                    <i class="bi bi-person-plus-fill me-2"></i>

                    Register Now

                </button>

            </form>

        </div>

        <!-- ================= RIGHT SIDE ================= -->

        <div class="image-section">

            <img
                src="/doctors.png"
                alt="Doctors">

            <div class="features">

                <div class="feature">

                    <i class="bi bi-shield-check"></i>

                    <div>

                        <h6>Secure</h6>

                        <span>Your Data</span>

                    </div>

                </div>

                <div class="feature">

                    <i class="bi bi-clock-history"></i>

                    <div>

                        <h6>Quick</h6>

                        <span>Registration</span>

                    </div>

                </div>

                <div class="feature">

                    <i class="bi bi-heart-pulse"></i>

                    <div>

                        <h6>Better</h6>

                        <span>Care</span>

                    </div>

                </div>

            </div>
            
            <div class="register-link">

                <p>

                    Already have an account?

                    <a routerLink="/login">

                        Login

                    </a>

                </p>

            </div>

        </div>

    </div>

</div>
