<div class="login-page">

    <div class="login-card">

        <!-- Left Section -->
        <div class="login-section">

            <div class="heading">

                <h1>
                    Welcome <span>Back</span>
                </h1>

                <p>
                    Sign in to continue to the Hospital Patient Management System.
                </p>

            </div>

            <form>

                <!-- Email -->

                <div class="mb-4">

                    <label class="form-label">
                        Email Address
                    </label>

                    <div class="input-box">

                        <i class="bi bi-envelope"></i>

                        <input
                            type="email"
                            class="form-control"
                            placeholder="Enter your email">

                    </div>

                </div>

                <!-- Password -->

                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <div class="input-box">

                        <i class="bi bi-lock"></i>

                        <input
                            type="password"
                            class="form-control"
                            placeholder="Enter password">

                        <span class="eye">

                            <i class="bi bi-eye"></i>

                        </span>

                    </div>

                </div>

                <!-- Remember -->

                <div class="login-options">

                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="checkbox">

                        <label class="form-check-label">

                            Remember Me

                        </label>

                    </div>

                    <a href="#">

                        Forgot Password?

                    </a>

                </div>

                <!-- Login Button -->

                <button class="btn login-btn w-100">

                    <i class="bi bi-box-arrow-in-right"></i>

                    Login

                </button>

                <!-- Register -->

                <div class="register-link">

                    <p>

                        Don't have an account?

                        <a routerLink="/register">

                            Register Now

                        </a>

                    </p>

                </div>

            </form>

        </div>

        <!-- Right Section -->

        <div class="image-section">

            <img
                src="/doctors.png"
                alt="Doctors">

            <div class="features">

                <div class="feature">

                    <i class="bi bi-shield-check"></i>

                    <h6>Secure Login</h6>

                </div>

                <div class="feature">

                    <i class="bi bi-heart-pulse"></i>

                    <h6>Better Care</h6>

                </div>

                <div class="feature">

                    <i class="bi bi-calendar-check"></i>

                    <h6>Appointments</h6>

                </div>

            </div>

        </div>

    </div>

</div>
